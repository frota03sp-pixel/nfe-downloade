services:
  - type: web
    name: nfe-downloader
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: NFE_AMBIENTE
        value: "1"
      - key: NFE_CUF_AUTOR
        value: "35"
      - key: NFE_CNPJ
        sync: false
      - key: NFE_CERT_PEM_B64
        sync: false
      - key: NFE_KEY_PEM_B64
        sync: false